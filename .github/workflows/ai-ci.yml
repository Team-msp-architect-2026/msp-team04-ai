name: AI Service CI – Docker Build & ECR Push

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  ECR_REPOSITORY_AI: moment-dev-ai-service

jobs:
  build-and-push:
    name: AI Service – Docker Build & ECR Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: tag
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build AI Service Docker image
        run: |
          docker build \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --label "service=ai-service" \
            -t ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_AI }}:dev-${{ steps.tag.outputs.SHORT_SHA }} \
            .

      - name: Push AI Service image to ECR
        id: push-ai
        run: |
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_AI }}:dev-${{ steps.tag.outputs.SHORT_SHA }}
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_AI }}:dev-${{ steps.tag.outputs.SHORT_SHA }})
          echo "AI_IMAGE_URI=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_AI }}:dev-${{ steps.tag.outputs.SHORT_SHA }}" >> $GITHUB_OUTPUT
          echo "AI_DIGEST=$DIGEST" >> $GITHUB_OUTPUT

      - name: Print image summary
        run: |
          echo "## Docker Build & ECR Push 결과" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Image URI | Digest |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| ai-service | ${{ steps.push-ai.outputs.AI_IMAGE_URI }} | ${{ steps.push-ai.outputs.AI_DIGEST }} |" >> $GITHUB_STEP_SUMMARY