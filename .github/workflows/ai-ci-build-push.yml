name: AI Service CI – Docker Build & ECR Push

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  ECR_REPOSITORY_AI: moment-dev-ai-service

jobs:
  build-and-push:
    name: AI Service – Docker Build & ECR Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image tag
        id: tag
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build & Push AI Service Docker image
        uses: docker/build-push-action@v5
        id: push-ai
        with:
          context: .
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_AI }}:dev-${{ steps.tag.outputs.SHORT_SHA }}
          cache-from: type=gha,scope=ai-service
          cache-to: type=gha,mode=max,scope=ai-service
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
            service=ai-service

      - name: Print image summary
        run: |
          echo "## Docker Build & ECR Push 결과" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Image URI | Digest |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| ai-service | ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_AI }}:dev-${{ steps.tag.outputs.SHORT_SHA }} | ${{ steps.push-ai.outputs.digest }} |" >> $GITHUB_STEP_SUMMARY

      - name: Save image info as artifact
        run: |
          mkdir -p /tmp/image-info
          echo "AI_SERVICE_IMAGE_URI=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_AI }}:dev-${{ steps.tag.outputs.SHORT_SHA }}" >> /tmp/image-info/image-info.env
          echo "IMAGE_TAG=dev-${{ steps.tag.outputs.SHORT_SHA }}" >> /tmp/image-info/image-info.env
          echo "AI_DIGEST=${{ steps.push-ai.outputs.digest }}" >> /tmp/image-info/image-info.env

      - name: Upload image info artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-image-info
          path: /tmp/image-info/image-info.env
          retention-days: 7

      - name: Trigger Helm values update
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITOPS_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'Team-msp-architect-2026',
              repo: 'msp-team04-infra',
              workflow_id: 'update-helm-values.yml',
              ref: 'develop',
              inputs: {
                service: 'ai-service',
                image_tag: 'dev-${{ steps.tag.outputs.SHORT_SHA }}',
                environment: 'dev',
                dry_run: 'false'
              }
            });
            console.log('Triggered Helm values update for dev-${{ steps.tag.outputs.SHORT_SHA }}');
