name: AI Service CI – Docker Build & ECR Push

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  ECR_REPOSITORY_AI: moment-dev-ai-service

jobs:
  build-and-push:
    name: AI Service – Docker Build & ECR Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image tag
        id: tag
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build & Push AI Service Docker image
        uses: docker/build-push-action@v5
        id: push-ai
        with:
          context: .
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_AI }}:dev-${{ steps.tag.outputs.SHORT_SHA }}
          cache-from: type=gha,scope=ai-service
          cache-to: type=gha,mode=max,scope=ai-service
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
            service=ai-service

      - name: Print image summary
        run: |
          echo "## Docker Build & ECR Push 결과" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Image URI | Digest |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| ai-service | ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_AI }}:dev-${{ steps.tag.outputs.SHORT_SHA }} | ${{ steps.push-ai.outputs.digest }} |" >> $GITHUB_STEP_SUMMARY